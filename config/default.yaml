scraper:
  tickers: [SPY, QQQ, IWM, GLD, AAPL, MSFT, TSLA, XLF]
  schedule_time: "16:30"          # 4:30 PM ET daily
  timezone: "America/New_York"
  min_open_interest: 10
  min_volume: 0
  max_spread_ratio: 0.5           # (ask-bid)/mid
  inter_ticker_delay: 1.5         # seconds between tickers to avoid rate-limits

storage:
  base_dir: "data"
  options_dir: "data/options"
  surfaces_dir: "data/surfaces"
  models_dir: "data/models"
