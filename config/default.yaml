scraper:
  tickers: [SPY, QQQ, AAPL, MSFT]
  schedule_time: "16:30"          # 4:30 PM ET daily
  timezone: "America/New_York"
  min_open_interest: 10
  min_volume: 0
  max_spread_ratio: 0.5           # (ask-bid)/mid

model:
  beta: 0.5                       # fixed SABR beta
  sabr_max_iter: 1000
  heston_n_fft: 4096
  rough_bergomi_n_paths: 10000
  rough_bergomi_n_steps: 252
  svi_max_iter: 2000

neural:
  state_dim: 32
  latent_dim: 16
  hidden_dim: 64
  n_epochs: 100
  batch_size: 32
  learning_rate: 1.0e-3
  walk_forward_window: 252        # training days
  validation_window: 63           # validation days

signals:
  skew_zscore_threshold: 1.5
  term_structure_zscore_threshold: 1.5
  butterfly_mispricing_bps: 50
  calendar_mispricing_bps: 30
  regime_low_vix: 15
  regime_high_vix: 25
  regime_crisis_vix: 35

backtest:
  initial_capital: 1_000_000
  transaction_cost_bps: 5
  slippage_bps: 2
  rebalance_frequency: "daily"

storage:
  base_dir: "data"
  options_dir: "data/options"
  surfaces_dir: "data/surfaces"
  models_dir: "data/models"
