# Standardised surface grid used for interpolation and neural models
grid:
  # Log-moneyness k = ln(K/F) knots
  log_moneyness:
    min: -0.40
    max:  0.20
    n_points: 25

  # Tenor in years
  tenor:
    values: [0.0833, 0.1667, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]   # 1M…2Y
    n_points: 8

# 25-delta moneyness reference points for skew signals
delta_strikes:
  put_25d:  -0.25
  atm:       0.0
  call_25d:  0.25

# Standard tenors for term-structure analysis (in months)
term_structure_tenors_months: [1, 2, 3, 6, 9, 12, 18, 24]
