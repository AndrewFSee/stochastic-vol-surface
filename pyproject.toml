[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-vol-surface"
version = "0.1.0"
description = "Implied-volatility surfaces, point-in-time vol features and a dashboard for equity/ETF options"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=2.0",               # np.trapezoid
    "scipy>=1.10",
    "plotly>=5.0",
    "streamlit>=1.50",          # segmented_control, st.context.theme, width="stretch"
    "apscheduler>=3.10",
    "fredapi>=0.5",
    "pandera>=0.17",
    "pydantic>=2.0",
    "pyarrow>=13.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pandas_market_calendars>=4.0",
    "kaggle>=1.6",
    "arch>=7.0",                # GARCH benchmarks in the forecast evaluation
    "scikit-learn>=1.3",        # gradient-boosting benchmark
    "anthropic>=1.0",           # dashboard interpretation (Claude)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Parked research code in experimental/ (see experimental/README.md).
experimental = [
    "torch>=2.0",               # neural SDE
    "hmmlearn>=0.3",            # optional HMM regime classifier
    "openai>=1.0",              # optional LLM narratives in the agent stubs
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared Windows temp dir (%LOCALAPPDATA%\Temp\pytest-of-<user>) is not
# readable on this machine, which breaks every tmp_path-based test.  Keep
# pytest's scratch space inside the project instead.  pytest wipes this
# directory at the start of each run, so nothing else may live here.
addopts = "--basetemp=.pytest_tmp"
